<!-- @dsCard group="Spacing" viewport="700x180" subtitle="4px base grid" name="Spacing scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 32px; background: var(--surface-card); font-family: var(--font-mono); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--accent); width: 14px; }
  .lab { font-size: var(--text-2xs); color: var(--text-subtle); }
  .cap { font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-subtle); margin: 0 0 18px; }
</style>
</head>
<body>
  <p class="cap">Spacing · token = px</p>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><span class="lab">1·4</span></div>
    <div class="item"><div class="bar" style="height:8px"></div><span class="lab">2·8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="lab">3·12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="lab">4·16</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="lab">6·24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="lab">8·32</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="lab">12·48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="lab">16·64</span></div>
    <div class="item"><div class="bar" style="height:80px"></div><span class="lab">20·80</span></div>
  </div>
</body>
</html>
