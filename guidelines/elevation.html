<!-- @dsCard group="Spacing" viewport="700x200" subtitle="Borders over shadows — shadows are rare" name="Elevation & rules" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-page); font-family: var(--font-mono); }
  .row { display: flex; gap: 22px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 92px; height: 64px; background: var(--surface-card); display: flex; align-items: center; justify-content: center; }
  .rule { border: var(--rule); }
  .xs { box-shadow: var(--shadow-xs); border: var(--rule); }
  .sm { box-shadow: var(--shadow-sm); }
  .md { box-shadow: var(--shadow-md); }
  .lg { box-shadow: var(--shadow-lg); }
  .lab { font-size: var(--text-2xs); color: var(--text-subtle); }
  .cap { font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-subtle); margin: 0 0 20px; }
</style>
</head>
<body>
  <p class="cap">Elevation · default is a hairline rule</p>
  <div class="row">
    <div class="item"><div class="box rule"></div><span class="lab">rule · 1px</span></div>
    <div class="item"><div class="box xs"></div><span class="lab">xs</span></div>
    <div class="item"><div class="box sm"></div><span class="lab">sm</span></div>
    <div class="item"><div class="box md"></div><span class="lab">md · popover</span></div>
    <div class="item"><div class="box lg"></div><span class="lab">lg · modal</span></div>
  </div>
</body>
</html>
