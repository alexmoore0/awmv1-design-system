<!-- @dsCard group="Type" viewport="700x190" subtitle="Newsreader — editorial display & long-form" name="Serif / Newsreader" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-card); color: var(--text-strong); font-family: var(--font-serif); }
  .eyebrow { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-subtle); margin: 0 0 14px; }
  .display { font-size: var(--text-4xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); font-weight: var(--weight-500, 500); margin: 0 0 10px; }
  .lede { font-size: var(--text-md); line-height: var(--leading-relaxed); color: var(--text-body); margin: 0; max-width: 60ch; }
  .lede em { font-style: italic; }
</style>
</head>
<body>
  <p class="eyebrow">Serif · Newsreader · 400 / 500 / 600 · italics</p>
  <div class="display">The quiet confidence of set type.</div>
  <p class="lede">Used for editorial display and long-form reading — headlines, pull quotes, and article body where <em>tone and texture</em> matter more than density.</p>
</body>
</html>
