<!-- @dsCard group="Brand" viewport="700x220" subtitle="Typographic wordmark — serif mark + mono tag" name="Wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--surface-card); font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; height: 220px; }
  .mark { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .lockup { display: flex; align-items: baseline; gap: 2px; }
  .a { font-family: var(--font-serif); font-size: 76px; font-weight: 600; letter-spacing: -0.03em; color: var(--text-strong); line-height: 1; }
  .w { font-family: var(--font-serif); font-size: 76px; font-weight: 600; letter-spacing: -0.03em; color: var(--text-strong); line-height: 1; }
  .m { font-family: var(--font-serif); font-size: 76px; font-weight: 600; letter-spacing: -0.03em; color: var(--accent); line-height: 1; }
  .v { font-family: var(--font-mono); font-size: 22px; color: var(--text-faint); align-self: flex-end; margin-bottom: 8px; margin-left: 4px; }
  .tag { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="mark">
    <div class="lockup"><span class="a">A</span><span class="w">W</span><span class="m">M</span><span class="v">v1</span></div>
    <span class="tag">Editorial · Technical · Light</span>
  </div>
</body>
</html>
