<!-- @dsCard group="Type" viewport="700x200" subtitle="Hanken Grotesk — all UI & app body" name="Sans / Hanken Grotesk" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-card); color: var(--text-strong); font-family: var(--font-sans); }
  .eyebrow { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-subtle); margin: 0 0 16px; }
  .row { display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap; }
  .w { display: flex; flex-direction: column; gap: 2px; }
  .w b { font-size: var(--text-2xl); line-height: 1.1; letter-spacing: var(--tracking-snug); }
  .w span { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-subtle); letter-spacing: 0.04em; }
  .r400 { font-weight: 400; } .r500 { font-weight: 500; } .r600 { font-weight: 600; } .r700 { font-weight: 700; }
  .body { margin: 18px 0 0; font-size: var(--text-sm); line-height: var(--leading-normal); color: var(--text-body); max-width: 64ch; }
</style>
</head>
<body>
  <p class="eyebrow">Sans · Hanken Grotesk · UI workhorse</p>
  <div class="row">
    <div class="w"><b class="r400">Regular</b><span>400</span></div>
    <div class="w"><b class="r500">Medium</b><span>500</span></div>
    <div class="w"><b class="r600">Semibold</b><span>600</span></div>
    <div class="w"><b class="r700">Bold</b><span>700</span></div>
  </div>
  <p class="body">The neutral grotesque that powers every interface surface — labels, buttons, table data, form fields, and app-context body copy. Clean, legible, quietly modern.</p>
</body>
</html>
