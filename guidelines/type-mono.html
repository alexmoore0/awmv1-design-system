<!-- @dsCard group="Type" viewport="700x180" subtitle="JetBrains Mono — eyebrows, metadata, code" name="Mono / JetBrains Mono" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-card); color: var(--text-strong); font-family: var(--font-mono); }
  .eyebrow { font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-subtle); margin: 0 0 18px; }
  .caps { font-size: var(--text-xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--accent-text); margin: 0 0 14px; }
  .meta { font-size: var(--text-sm); color: var(--text-body); margin: 0 0 12px; display: flex; gap: 18px; flex-wrap: wrap; }
  .code { font-size: var(--text-sm); line-height: var(--leading-normal); background: var(--surface-inset); border: var(--rule); padding: 10px 14px; color: var(--text-body); display: inline-block; }
  .code b { color: var(--accent-text); font-weight: 500; }
</style>
</head>
<body>
  <p class="eyebrow">Mono · JetBrains Mono · technical voice</p>
  <p class="caps">Section eyebrow · uppercase + wide tracking</p>
  <div class="meta"><span>12 MIN READ</span><span>v1.4.0</span><span>MAR 2026</span><span>· 64 commits</span></div>
  <code class="code">const <b>accent</b> = "oklch(0.552 0.172 256)";</code>
</body>
</html>
