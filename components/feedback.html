<!-- @dsCard group="Components" viewport="760x420" subtitle="Modal dialog + toast notifications" name="Modals & toasts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; padding: 0; background: var(--surface-page); font-family: var(--font-sans); }
  .stage { position: relative; min-height: 420px; padding: 24px; }
  /* show modal inline (not fixed) for the specimen */
  .demo-scrim { position: absolute; inset: 0; background: oklch(0.205 0.012 256 / 0.34); display: grid; place-items: center; border-radius: var(--radius-md); }
  .toasts { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
</style>
</head>
<body>
  <div class="stage">
    <div class="demo-scrim">
      <div class="awm-modal" style="animation:none">
        <div class="awm-modal__header">
          <h3 class="awm-modal__title">Delete this project?</h3>
          <button class="awm-btn awm-btn--ghost awm-icon-btn awm-btn--sm" aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="awm-modal__body">This removes <strong style="color:var(--text-strong)">deploy-pipeline</strong> and all of its build history. This action can't be undone.</div>
        <div class="awm-modal__footer">
          <button class="awm-btn awm-btn--secondary">Cancel</button>
          <button class="awm-btn awm-btn--danger">Delete project</button>
        </div>
      </div>
    </div>
    <div class="toasts">
      <div class="awm-toast">
        <span class="awm-toast__icon awm-toast__icon--success"><svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 9.2 8 11.5l4.5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="awm-toast__body"><span class="awm-toast__title">Deployed to production</span><span class="awm-toast__msg">v1.4.0 is live · 1m 12s</span></div>
        <button class="awm-toast__close" aria-label="Dismiss"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
      <div class="awm-toast">
        <span class="awm-toast__icon awm-toast__icon--danger"><svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.4"/><path d="M9 5v4.5M9 12h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
        <div class="awm-toast__body"><span class="awm-toast__title">Build failed</span><span class="awm-toast__msg">Check the logs for step 3.</span></div>
        <button class="awm-toast__close" aria-label="Dismiss"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>
</body>
</html>
