<!-- @dsCard group="Components" viewport="760x260" subtitle="Underline tabs + segmented control" name="Navigation & tabs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-card); }
  .wrap { display: flex; flex-direction: column; gap: 26px; }
  .cap { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-subtle); margin: 0 0 12px; }
  .panel { padding: 18px 2px; font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <p class="cap">Breadcrumbs</p>
      <nav class="awm-breadcrumbs" aria-label="Breadcrumb">
        <a href="#">Workspace</a>
        <span class="awm-breadcrumbs__sep">/</span>
        <a href="#">Projects</a>
        <span class="awm-breadcrumbs__sep">/</span>
        <span aria-current="page">deploy-pipeline</span>
      </nav>
    </div>
    <div>
      <p class="cap">Underline tabs</p>
      <div class="awm-tabs">
        <div class="awm-tabs__list" role="tablist" aria-label="Project sections">
          <button class="awm-tab is-active" id="tab-overview" type="button" role="tab" aria-selected="true" aria-controls="panel-overview">Overview</button>
          <button class="awm-tab" id="tab-activity" type="button" role="tab" aria-selected="false" aria-controls="panel-activity" tabindex="-1">Activity</button>
          <button class="awm-tab" id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" tabindex="-1">Settings</button>
          <button class="awm-tab" id="tab-members" type="button" role="tab" aria-selected="false" aria-controls="panel-members" tabindex="-1">Members</button>
        </div>
        <div class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">The selected tab is marked by a 2px accent rule that sits on the shared hairline baseline.</div>
      </div>
    </div>
    <div>
      <p class="cap">Segmented control</p>
      <div class="awm-segmented" role="group" aria-label="Date range">
        <button class="awm-segmented__item is-active" type="button" aria-pressed="true">Day</button>
        <button class="awm-segmented__item" type="button" aria-pressed="false">Week</button>
        <button class="awm-segmented__item" type="button" aria-pressed="false">Month</button>
      </div>
    </div>
  </div>
</body>
</html>
